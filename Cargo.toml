[package]
name = "tpack"
version = "0.1.0"
edition = "2021"
description = "Texture packing CLI"
license = "MIT"

[workspace]
members = ["lib/rect_pack", "lib/cli-parser", "lib/hashing"]
resolver = "2"

[dependencies]
cli-parser = { path = "lib/cli-parser" }
hashing = { path = "lib/hashing" }
bytemuck = "1.25"
image = { version = "0.25", default-features = false, features = ["png"] }
rect_pack = { path = "lib/rect_pack" }

[profile.release]
lto = true
strip = true

[[test]]
name = "harness"
harness = false
